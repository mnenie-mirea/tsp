[workspace]
resolver = "2"
members = ["crates/editor", "crates/monitor", "crates/monitor-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
printpdf = "0.12"
gpui-kit = "0.8.1"
sysinfo = "0.33"
notify-rust = "4"
serde_json = "1"
anyhow = "1"